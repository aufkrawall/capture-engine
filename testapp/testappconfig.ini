; Test Application Configuration
; This file controls settings for dx12_test.exe and vulkan_test.exe

[Display]
; Window resolution
width=3840
height=2160
; Borderless fullscreen (uses native screen resolution, ignores width/height)
; 0 = windowed at configured width/height, 1 = borderless fullscreen
fullscreen=1

[Performance]
; GPU load passes - higher = more GPU work per frame
; Increase for ~70% GPU load at your target FPS
; Typical values: 15 (light), 40 (moderate), 80 (heavy)
gpu_load=120

[Rendering]
; VSync mode
; 0 = Off (uncapped - FPS limiter handles pacing)
; 1 = On (VSync enabled)
vsync=1
