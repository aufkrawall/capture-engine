name: debug-token

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
    env:
      CTX_TOKEN: ${{ github.token }}
    steps:
      - name: Token length
        shell: pwsh
        run: |
          Write-Output "env_len=$($env:GITHUB_TOKEN.Length)"
          Write-Output "ctx_len=$($env:CTX_TOKEN.Length)"
