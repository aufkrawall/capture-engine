name: hardening-ci

# Manual-only since 2026-08-02: push/PR CI is disabled by request.
# Stable releases are produced by release-stable.yml (also manual dispatch).
on:
  workflow_dispatch:

concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache Linux MSYS2 packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/msys64_linux
          key: linux-msys2-${{ runner.os }}-${{ hashFiles('build.py', 'tools/build/*.py', 'tools/ffmpeg_dependencies.json') }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            glslang-tools \
            llvm \
            pkg-config \
            spirv-tools \
            zstd

      - name: Run build policy tests on Linux
        shell: pwsh
        run: python -m unittest -v tools.tests.test_build_flags tools.tests.test_build_testapp_tasks tools.tests.test_pe_hardening

      - name: Cross-compile on Linux
        shell: pwsh
        run: python build.py --skip-updates
