name: hardening-ci

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "analysis/**"
      - "analysis_logs/**"
      - "*.log"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "analysis/**"
      - "analysis_logs/**"
      - "*.log"
  workflow_dispatch:

concurrency:
  group: hardening-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Linux MSYS2 packages
        uses: actions/cache@v4
        with:
          path: build/msys64_linux
          key: linux-msys2-${{ runner.os }}-${{ hashFiles('build.py') }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            llvm \
            pkg-config \
            zstd

      - name: Cross-compile on Linux
        shell: pwsh
        run: |
          python -m unittest -v test_build_flags.py test_pe_hardening.py
          python build.py --skip-updates
