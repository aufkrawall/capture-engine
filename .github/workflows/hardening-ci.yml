name: hardening-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-standard
            args: --skip-updates --run-tests
          - os: windows-latest
            name: windows-sanitize
            args: --skip-updates --sanitize --run-tests
          - os: ubuntu-latest
            name: linux-build
            args: --skip-updates --incremental

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 pkg-config zstd

      - name: Build and run tests (${{ matrix.name }})
        shell: pwsh
        run: python build.py ${{ matrix.args }}
