name: CodeQL (C/C++)

# Manual (workflow_dispatch) plus a weekly baseline scan. Deliberately NOT
# triggered on every push: a traced Linux cross-compile of the full product
# is heavy, and the repo's own CI is manual-only. The previous default-setup
# c-cpp job was useless: its Linux autobuild could not build this MSYS2
# Windows project, so it scanned an empty database on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: codeql-cpp

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache Linux MSYS2 packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/msys64_linux
          key: linux-msys2-${{ runner.os }}-${{ hashFiles('build.py', 'tools/build/*.py', 'tools/ffmpeg_dependencies.json') }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            glslang-tools \
            llvm \
            pkg-config \
            spirv-tools \
            zstd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: cpp

      - name: Build (traced)
        shell: pwsh
        run: python build.py --skip-updates

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
